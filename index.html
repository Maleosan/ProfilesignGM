<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1525">
    <meta name="description" content="Profil karyawan dan tanda tangan digital.">
    <title>Profil Karyawan</title>
    <link rel="preload" as="image" href="assets/profile.jpg" type="image/jpeg">
    <link rel="preload" as="image" href="assets/signature.png" type="image/png">
    <link rel="preload" as="image" href="assets/logo.jpg" type="image/jpeg">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1525'/%3E%3Ccircle cx='32' cy='23' r='10' fill='%23d9b765'/%3E%3Cpath d='M14 54c2-12 9-18 18-18s16 6 18 18' fill='%23d9b765'/%3E%3C/svg%3E">
    <style>
      :root {
        color-scheme: dark;
        --page-bg: #0b1525;
        --page-bg-soft: #142641;
        --accent: #d9b765;
        --text: #f5f7fb;
        --muted: #b9c3d2;
        --paper: #ffffff;
        --ink: #16243a;
        --transition-duration: 760ms;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--page-bg);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        -webkit-tap-highlight-color: transparent;
      }

      .viewer {
        position: relative;
        display: grid;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }

      .viewer::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        background:
          radial-gradient(circle at 50% 40%, rgb(47 73 110 / 52%), transparent 52%),
          linear-gradient(145deg, var(--page-bg-soft), var(--page-bg) 68%);
        content: "";
        transition: opacity var(--transition-duration) ease;
      }

      .viewer.is-signature::before {
        opacity: 0.78;
      }

      .viewer:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: -6px;
      }

      .image-frame {
        position: absolute;
        inset: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
        display: grid;
        place-items: center;
      }

      .profile {
        display: block;
        width: min(92vw, 960px);
        height: min(86vh, 760px);
        height: min(86dvh, 760px);
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        opacity: 1;
        pointer-events: none;
        transform: scale(1);
        transition:
          opacity var(--transition-duration) ease,
          transform var(--transition-duration) cubic-bezier(0.22, 1, 0.36, 1);
        -webkit-user-drag: none;
      }

      .viewer.is-signature .profile,
      .viewer.has-error .profile {
        opacity: 0;
        transform: scale(0.965);
      }

      .signature-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
        gap: clamp(0.8rem, 3.5vw, 3.25rem);
        align-items: center;
        width: min(92vw, 1080px);
        max-width: 100%;
        max-height: 100%;
        padding: clamp(1rem, 4vw, 3.25rem);
        overflow: hidden;
        border: 1px solid rgb(217 183 101 / 38%);
        border-radius: clamp(1rem, 3vw, 2rem);
        background: var(--paper);
        box-shadow: 0 1.75rem 5rem rgb(0 0 0 / 32%);
        color: var(--ink);
        opacity: 0;
        pointer-events: none;
        transform: scale(1.025);
        transition:
          opacity var(--transition-duration) ease,
          transform var(--transition-duration) cubic-bezier(0.22, 1, 0.36, 1);
      }

      .viewer.is-signature .signature-card {
        opacity: 1;
        transform: scale(1);
      }

      .signature-art {
        display: grid;
        min-width: 0;
        min-height: clamp(8rem, 28dvh, 18rem);
        place-items: center;
        padding-right: clamp(0.75rem, 2.5vw, 2.25rem);
        border-right: 1px solid rgb(22 36 58 / 14%);
      }

      .signature {
        display: block;
        width: 100%;
        height: clamp(8rem, 28dvh, 18rem);
        object-fit: contain;
        pointer-events: none;
        -webkit-user-drag: none;
      }

      .identity {
        display: grid;
        min-width: 0;
        align-content: center;
        justify-items: start;
      }

      .brand-logo {
        display: block;
        width: clamp(3.5rem, 9vw, 6.5rem);
        height: clamp(3.25rem, 8vw, 6rem);
        margin-bottom: clamp(0.75rem, 2.4vw, 1.5rem);
        object-fit: contain;
        pointer-events: none;
        -webkit-user-drag: none;
      }

      .employee-name {
        max-width: 17ch;
        margin: 0;
        color: var(--ink);
        font-size: clamp(1.05rem, 3.5vw, 2.35rem);
        line-height: 1.12;
        letter-spacing: -0.025em;
      }

      .employee-title {
        margin: clamp(0.6rem, 1.8vw, 1rem) 0 0;
        color: #526075;
        font-size: clamp(0.75rem, 1.8vw, 1.05rem);
        font-weight: 600;
        line-height: 1.45;
      }

      .employee-title span {
        color: #d8492d;
      }

      .fallback {
        position: absolute;
        width: min(88vw, 32rem);
        padding: 1.25rem 1.5rem;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 1rem;
        background: rgb(7 16 29 / 72%);
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 24%);
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transform: translateY(0.5rem);
        transition:
          opacity 300ms ease,
          transform 300ms ease;
        backdrop-filter: blur(12px);
      }

      .viewer.has-error .fallback {
        opacity: 1;
        transform: translateY(0);
      }

      @media (orientation: landscape) and (max-height: 520px) {
        .image-frame {
          inset: max(0.75rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
            max(0.75rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }

        .profile {
          width: min(88vw, 960px);
          height: min(90dvh, 560px);
        }

        .signature-card {
          width: min(90vw, 960px);
          padding: 0.8rem 1.25rem;
        }

        .signature-art,
        .signature {
          height: min(54dvh, 15rem);
          min-height: 0;
        }

        .brand-logo {
          width: 3.5rem;
          height: 3.25rem;
          margin-bottom: 0.45rem;
        }

        .employee-name {
          font-size: clamp(1rem, 3.2vw, 1.65rem);
        }

        .employee-title {
          margin-top: 0.35rem;
          font-size: clamp(0.7rem, 1.7vw, 0.9rem);
        }
      }

      @media (max-width: 420px) and (orientation: portrait) {
        .signature-card {
          grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
          gap: 0.75rem;
          padding: 1rem;
        }

        .signature-art {
          min-height: 8.5rem;
          padding-right: 0.75rem;
        }

        .signature {
          height: 8.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        :root {
          --transition-duration: 1ms;
        }

        .profile,
        .signature-card,
        .fallback {
          transform: none !important;
          transition-property: opacity;
        }
      }
    </style>
  </head>
  <body>
    <main
      class="viewer"
      id="viewer"
      role="button"
      tabindex="0"
      aria-label="Tampilkan gambar nama dan tanda tangan"
      aria-live="polite"
    >
      <div class="image-frame" aria-hidden="false">
        <img
          class="profile"
          id="profileImage"
          src="assets/profile.jpg"
          alt="Foto profil karyawan"
          draggable="false"
          decoding="async"
        >
      </div>

      <div class="image-frame" aria-hidden="true" id="signatureFrame">
        <section class="signature-card" aria-label="Identitas dan tanda tangan General Manager">
          <div class="signature-art">
            <img
              class="signature"
              id="signatureImage"
              src="assets/signature.png"
              alt="Tanda tangan Zacharias Marshel Hendrik"
              draggable="false"
              decoding="async"
            >
          </div>

          <div class="identity">
            <img
              class="brand-logo"
              id="companyLogo"
              src="assets/logo.jpg"
              alt="Logo Swiss-BelHotel International"
              draggable="false"
              decoding="async"
            >
            <h1 class="employee-name">Zacharias Marshel Hendrik</h1>
            <p class="employee-title">
              General Manager<br>
              <span>Swiss-BelHotel Maleosan Manado</span>
            </p>
          </div>
        </section>
      </div>

      <p class="fallback" id="fallback" role="status" hidden>
        Gambar tidak dapat dimuat. Silakan periksa kembali file di folder assets.
      </p>
    </main>

    <script>
      (() => {
        "use strict";

        const HOLD_DURATION = 2500;
        const viewer = document.getElementById("viewer");
        const profileImage = document.getElementById("profileImage");
        const signatureImage = document.getElementById("signatureImage");
        const companyLogo = document.getElementById("companyLogo");
        const signatureFrame = document.getElementById("signatureFrame");
        const fallback = document.getElementById("fallback");
        let transitionStarted = false;
        let automaticTransition;

        const waitForImage = (image) => {
          if (image.complete) {
            return image.naturalWidth > 0
              ? Promise.resolve()
              : Promise.reject(new Error("Image failed to load"));
          }

          return new Promise((resolve, reject) => {
            image.addEventListener("load", resolve, { once: true });
            image.addEventListener(
              "error",
              () => reject(new Error("Image failed to load")),
              { once: true }
            );
          });
        };

        const signatureReady = Promise.all([
          waitForImage(signatureImage),
          waitForImage(companyLogo),
        ]);

        const showFallback = () => {
          if (transitionStarted) return;
          transitionStarted = true;
          window.clearTimeout(automaticTransition);
          fallback.hidden = false;
          viewer.classList.add("has-error");
          viewer.removeAttribute("role");
          viewer.removeAttribute("tabindex");
          viewer.removeAttribute("aria-label");
        };

        const showSignature = () => {
          if (transitionStarted) return;
          transitionStarted = true;
          window.clearTimeout(automaticTransition);
          signatureFrame.setAttribute("aria-hidden", "false");
          profileImage.setAttribute("aria-hidden", "true");
          viewer.classList.add("is-signature");
          viewer.removeAttribute("role");
          viewer.removeAttribute("tabindex");
          viewer.removeAttribute("aria-label");
        };

        const requestSignature = () => {
          if (transitionStarted) return;
          window.clearTimeout(automaticTransition);
          signatureReady.then(showSignature).catch(showFallback);
        };

        automaticTransition = window.setTimeout(requestSignature, HOLD_DURATION);

        viewer.addEventListener("click", requestSignature);
        viewer.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            requestSignature();
          }
        });

        waitForImage(profileImage).catch(showFallback);
      })();
    </script>
  </body>
</html>
