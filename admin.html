<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1525">
    <meta name="description" content="Employee Manager untuk profile dan tanda tangan karyawan.">
    <title>Employee Manager</title>
    <link rel="stylesheet" href="assets/admin.css">
    <script src="assets/admin.js" defer></script>
  </head>
  <body>
    <header class="admin-header">
      <div>
        <p class="eyebrow">Profile &amp; Signature</p>
        <h1>Employee Manager</h1>
        <p>Siapkan data karyawan dan ekspor file yang siap dimasukkan ke repository.</p>
      </div>
      <a href="./">Kembali ke daftar</a>
    </header>

    <main class="admin-layout">
      <section class="panel employee-panel" aria-labelledby="employeeTitle">
        <div class="panel-heading">
          <div>
            <p class="section-label">Employees</p>
            <h2 id="employeeTitle">Data Karyawan</h2>
          </div>
          <button class="button secondary" id="newEmployee" type="button">Karyawan Baru</button>
        </div>

        <div class="employee-list" id="employeeList" aria-live="polite"></div>

        <form id="employeeForm" novalidate>
          <input id="originalSlug" type="hidden">

          <div class="form-grid">
            <label>
              <span>Nama Karyawan</span>
              <input id="employeeName" name="name" type="text" autocomplete="name" required>
            </label>

            <label>
              <span>Profile ID / Slug</span>
              <input id="employeeSlug" name="slug" type="text" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="contoh: michael" required>
              <small>Gunakan huruf kecil, angka, dan tanda hubung.</small>
            </label>

            <label class="full-width">
              <span>Jabatan</span>
              <input id="employeePosition" name="position" type="text" required>
            </label>

            <label>
              <span>Foto Profil</span>
              <input id="profileFile" name="profile" type="file" accept="image/*">
              <small id="profileStatus">Belum ada file.</small>
            </label>

            <label>
              <span>Tanda Tangan</span>
              <input id="signatureFile" name="signature" type="file" accept="image/png,image/*">
              <small id="signatureStatus">Belum ada file.</small>
            </label>
          </div>

          <p class="form-message" id="employeeMessage" role="status"></p>

          <div class="actions">
            <button class="button secondary" id="previewEmployee" type="button">Preview</button>
            <button class="button primary" type="submit">Generate / Export</button>
          </div>
        </form>

        <div class="export-row">
          <button class="button secondary" id="exportEmployees" type="button">Export employees.json</button>
          <button class="button primary" id="exportAll" type="button">Export All</button>
        </div>
      </section>

      <section class="panel settings-panel" aria-labelledby="settingsTitle">
        <p class="section-label">Global</p>
        <h2 id="settingsTitle">Company Settings</h2>

        <form id="settingsForm" novalidate>
          <label>
            <span>Company Name</span>
            <input id="companyName" name="companyName" type="text" required>
          </label>

          <label>
            <span>Company Logo</span>
            <input id="logoFile" name="logo" type="file" accept="image/*">
            <small id="logoStatus">Menggunakan logo saat ini.</small>
          </label>

          <p class="form-message" id="settingsMessage" role="status"></p>

          <div class="actions">
            <button class="button secondary" id="previewSettings" type="button">Preview</button>
            <button class="button primary" id="exportSettings" type="submit">Export Settings</button>
          </div>
        </form>
      </section>
    </main>

    <dialog id="previewDialog">
      <div class="dialog-header">
        <strong>Preview</strong>
        <button class="dialog-close" id="closePreview" type="button" aria-label="Tutup preview">×</button>
      </div>
      <iframe id="previewFrame" title="Preview profile karyawan"></iframe>
    </dialog>
  </body>
</html>
